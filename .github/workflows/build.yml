name: Capture SDK checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    name: Capture policy (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8.18'
            pytest: '7.4.4'
          - python: '3.14.4'
            pytest: '8.4.2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install source dependencies
        # shortcut: runtime dependencies resolve from PyPI; freeze them before release builds.
        run: python -m pip install --disable-pip-version-check --no-cache-dir . "pytest==${{ matrix.pytest }}"
      - name: Check capture policy
        run: python -B -m pytest tests/test_capture_policy.py -q -p no:cacheprovider
